</head>

                <h1 class="logo-text mb-0">Just a Drink</h1>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav middle-nav">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="Inicio.html">Início</a>

                        <a class="nav-link nav-link-custom" href="categorias/categorias.html">Categorias</a>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link cta-button" href="Cadastro.html">Cadastre sua Receita</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Banner - começa no topo, sob a navbar -->
    <div class="banner-container">
        <img
            src="icons/BannerInicial.png"
            class="img-fluid banner-img"
            alt="Banner"
        />
    </div>

    <div class="container mt-5">
        <div class="card shadow-lg rounded-4 ">
          <div class="card-body p-4">
            <h2 class="text-center">Cadastrar Receita</h2>
            <form>
              <div class="mb-3">
                <label for="nomeReceita" class="form-label">Nome da Receita:</label>
                <textarea class="form-control" id="nomeReceita" rows="1" placeholder="Ex: Moscow Mule"></textarea>
              </div>
              <div class="mb-3">
                <label for="Categoria" class="form-label">Categoria:</label>
                <select class="form-select" aria-label="Categoria">
                  <option selected>Selecione a categoria</option>
                  <option value="1">Clássicos</option>
                  <option value="2">Aromaticos</option>
                  <option value="3">Energeticos</option>
                  <option value="4">Sem álcool</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="Descricao" class="form-label">Dercrição:</label>
                <textarea class="form-control" id="Descricao" rows="3" placeholder="Descreva seu drink!"></textarea>
              </div>
              <div class="mb-3">
                <label for="Ingredientes" class="form-label">Ingredientes:</label>
                <textarea class="form-control" id="Ingredientes" rows="" placeholder="Digite os ingredientes"></textarea>
              </div>
              <div class="mb-3">
                <label for="Modo-Preparo" class="form-label">Modo de Preparo:</label>
                <textarea class="form-control" id="Ingredientes" rows="" placeholder="Digite o passo a passo"></textarea>
              </div>
              <div class="mb-3">
                <label for="Tempo" class="form-label">Tempo de Preparo (min):</label>
                <input type="number" class="form-control" id="Tempo">
              </div>
              <div class="mb-3">
                <label for="imagem-drink" class="form-label">Escolha uma foto para seu drink:</label>
                <input class="form-control" type="file" id="imagem-drink" accept="image">
              </div>
              <button type="submit" class="btn btn-primary">Cadastrar Receita</button>
            </form>
          </div>
        </div>
    </div>
        <!-- Footer -->
    <footer class="rodape" id="footer">
        <div class="inicio-do-rodape">
            <h2>JUST A DRINK</h2>
            <img src="icons/logo-footer.png" class="logo-rodape" />
        </div>
        <p>SIGA OS AUTORES</p>
